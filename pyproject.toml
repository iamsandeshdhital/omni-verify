[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-verify"
version = "0.1.0"
description = "Multi-platform content integrity engine: CCR scoring, tiered enforcement, and platform-capability-aware projection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "omni-verify contributors" }]
keywords = ["misinformation", "fact-checking", "content-integrity", "llm", "auditability"]

# Core engine is pure stdlib on purpose: the scorer must run in environments
# where installing dependencies is undesirable (air-gapped review consoles,
# CI sandboxes, regulators' machines).
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
verify = ["httpx>=0.27", "tiktoken>=0.7"]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
omni-verify = "omni_verify.cli:main"

[project.urls]
Homepage = "https://github.com/iamsandeshdhital/omni-verify"
Documentation = "https://github.com/iamsandeshdhital/omni-verify/blob/main/docs/PAPER.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]